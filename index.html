<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon PBS Compendium</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="dark-theme">

  <header>
    <h1>Pokemon PBS Compendium</h1>
    <p class="subtitle">Click on any move or ability for details. Click a Pokemon's name for defensive type matchups.</p>
  </header>

  <!-- Filter & Sort Bar -->
  <div class="filter-container">
    <div class="filter-group">
      <label for="filter-name">Name:</label>
      <input type="text" id="filter-name" placeholder="e.g. Bulbasaur" />
    </div>

    <div class="filter-group">
      <label for="filter-type1">Type 1:</label>
      <select id="filter-type1">
        <option value="">Any Type</option>
        <option value="NORMAL">Normal</option>
        <option value="FIRE">Fire</option>
        <option value="WATER">Water</option>
        <option value="GRASS">Grass</option>
        <option value="ELECTRIC">Electric</option>
        <option value="ICE">Ice</option>
        <option value="FIGHTING">Fighting</option>
        <option value="POISON">Poison</option>
        <option value="GROUND">Ground</option>
        <option value="FLYING">Flying</option>
        <option value="PSYCHIC">Psychic</option>
        <option value="BUG">Bug</option>
        <option value="ROCK">Rock</option>
        <option value="GHOST">Ghost</option>
        <option value="DRAGON">Dragon</option>
        <option value="STEEL">Steel</option>
        <option value="DARK">Dark</option>
        <option value="FAIRY">Fairy</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-type2">Type 2:</label>
      <select id="filter-type2">
        <option value="">Any / None</option>
        <option value="NORMAL">Normal</option>
        <option value="FIRE">Fire</option>
        <option value="WATER">Water</option>
        <option value="GRASS">Grass</option>
        <option value="ELECTRIC">Electric</option>
        <option value="ICE">Ice</option>
        <option value="FIGHTING">Fighting</option>
        <option value="POISON">Poison</option>
        <option value="GROUND">Ground</option>
        <option value="FLYING">Flying</option>
        <option value="PSYCHIC">Psychic</option>
        <option value="BUG">Bug</option>
        <option value="ROCK">Rock</option>
        <option value="GHOST">Ghost</option>
        <option value="DRAGON">Dragon</option>
        <option value="STEEL">Steel</option>
        <option value="DARK">Dark</option>
        <option value="FAIRY">Fairy</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-location">Location / Ep:</label>
      <input type="text" id="filter-location" placeholder="e.g. Polaris or Ep1" />
    </div>

    <div class="filter-group">
      <label for="filter-egg">Egg Group:</label>
      <select id="filter-egg">
        <option value="">All Egg Groups</option>
        <option value="Monster">Monster</option>
        <option value="Water1">Water 1</option>
        <option value="Water2">Water 2</option>
        <option value="Water3">Water 3</option>
        <option value="Bug">Bug</option>
        <option value="Flying">Flying</option>
        <option value="Field">Field</option>
        <option value="Fairy">Fairy</option>
        <option value="Grass">Grass</option>
        <option value="Humanlike">Human-Like</option>
        <option value="Mineral">Mineral</option>
        <option value="Amorphous">Amorphous</option>
        <option value="Dragon">Dragon</option>
        <option value="Undiscovered">Undiscovered</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-lvl-egg-move">Level / Egg Move:</label>
      <input type="text" id="filter-lvl-egg-move" placeholder="e.g. Tackle, Leech Seed" />
    </div>

    <div class="filter-group">
      <label for="filter-tm-tutor-move">TM / Tutor Move:</label>
      <input type="text" id="filter-tm-tutor-move" placeholder="e.g. Earthquake, Psyshock" />
    </div>

    <div class="filter-group">
      <label for="filter-ability">Ability:</label>
      <input type="text" id="filter-ability" placeholder="e.g. Overgrow" />
    </div>

    <div class="filter-group">
      <label for="sort-by">Sort By:</label>
      <select id="sort-by">
        <option value="id_asc">Dex Number (#)</option>
        <option value="name_asc">Name (A-Z)</option>
        <option value="bst_desc">BST (High to Low)</option>
        <option value="bst_asc">BST (Low to High)</option>
        <option value="hp_desc">HP (High to Low)</option>
        <option value="atk_desc">Attack (High to Low)</option>
        <option value="def_desc">Defense (High to Low)</option>
        <option value="spa_desc">Sp. Atk (High to Low)</option>
        <option value="spd_desc">Sp. Def (High to Low)</option>
        <option value="spe_desc">Speed (High to Low)</option>
      </select>
    </div>

    <div class="filter-group checkbox-group">
      <label for="color-moves-toggle">
        <input type="checkbox" id="color-moves-toggle" />
        Colour Moves
      </label>
    </div>

	<div class="filter-group checkbox-group">
      <label for="dark-mode-toggle">
        <input type="checkbox" id="dark-mode-toggle" />
        Black Theme
      </label>
    </div>
	

    <!-- Actions: Search & Reset -->
    <div class="button-group">
      <button id="search-btn" type="button">Search</button>
      <button id="reset-btn" type="button">Reset</button>
    </div>
  </div>

  <div class="results-count" id="results-count">Loading Pokemon...</div>

  <!-- Pokemon Table -->
  <div class="table-wrapper">
    <table id="compendium-table">
      <thead>
        <tr>
          <th>#</th>
		  <th>Sprite</th>
          <th>Name</th>
          <th>Type</th>
          <th>BST</th>
          <th>Stats</th>
          <th>Abilities, Encounters, Movesets & Details</th>
        </tr>
      </thead>
      <tbody id="pokemon-rows"></tbody>
    </table>
  </div>

  <!-- Detail Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal(event)">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="./extraData.js"></script>
  <script src="./app.js"></script>
</body>
</html>
